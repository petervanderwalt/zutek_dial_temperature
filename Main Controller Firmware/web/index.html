<!DOCTYPE html>
<html>
<head>
  <title>ESP32-S3 Flasher</title>
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }
    .flasher-container {
      text-align: center;
      background: white;
      border: 1px solid #ddd;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    h1 { margin-top: 0; color: #333; }
    p { color: #666; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="flasher-container">
    <h1>ESP32-S3 Flasher</h1>
    <p>Connect your device via USB and click the button below to install the latest firmware.</p>
    <!-- The manifest points to the file in the same directory -->
    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
  </div>
</body>
</html>
